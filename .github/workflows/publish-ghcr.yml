name: Publish connector container images

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish
        required: true
        type: string
      release_tag:
        description: Repository release tag to apply to the image
        required: true
        type: string
      meta_image_changed:
        description: Publish the Meta image
        required: true
        type: boolean
      github_image_changed:
        description: Publish the GitHub image
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish_meta:
    name: Publish Meta image when changed
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        if: inputs.meta_image_changed
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        if: inputs.meta_image_changed
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: inputs.meta_image_changed
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meta-mcp-server
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: inputs.meta_image_changed
        uses: docker/setup-buildx-action@v3

      - name: Build and push Meta image
        if: inputs.meta_image_changed
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Explain skipped image
        if: ${{ !inputs.meta_image_changed }}
        run: echo "Meta image unchanged; no container image published."

  publish_github:
    name: Publish GitHub image when changed
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        if: inputs.github_image_changed
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        if: inputs.github_image_changed
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: inputs.github_image_changed
        id: github
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/github-mcp-server
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: inputs.github_image_changed
        uses: docker/setup-buildx-action@v3

      - name: Build and push GitHub image
        if: inputs.github_image_changed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.github
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.github.outputs.tags }}
          labels: ${{ steps.github.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Explain skipped image
        if: ${{ !inputs.github_image_changed }}
        run: echo "GitHub image unchanged; no container image published."
