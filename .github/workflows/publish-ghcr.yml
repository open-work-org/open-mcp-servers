name: Publish Meta container image

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish
        required: true
        type: string
      release_tag:
        description: Repository release tag to apply to the image
        required: true
        type: string
      meta_image_changed:
        description: Publish the Meta image
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/meta-mcp-server

jobs:
  publish:
    name: Publish Meta image when changed
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        if: inputs.meta_image_changed
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        if: inputs.meta_image_changed
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: inputs.meta_image_changed
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: inputs.meta_image_changed
        uses: docker/setup-buildx-action@v3

      - name: Build and push Meta image
        if: inputs.meta_image_changed
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Explain skipped image
        if: ${{ !inputs.meta_image_changed }}
        run: echo "Meta image unchanged; no container image published."
