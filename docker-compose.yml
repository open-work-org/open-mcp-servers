services:
  meta-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "${MCP_HTTP_PORT:-3000}:3000"
    environment:
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?Set META_ACCESS_TOKEN in .env}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN:-}
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/mcp}
      MCP_HTTP_AUTH_TOKEN: ${MCP_HTTP_AUTH_TOKEN:?Set MCP_HTTP_AUTH_TOKEN in .env}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-}
